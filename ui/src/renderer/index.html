<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src http://127.0.0.1:8000" />
    <title>Personal Work Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="window">
      <aside class="sidebar">
        <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <button id="new-chat" class="new-chat" type="button"><span class="new-chat__icon">＋</span>新建对话<span class="shortcut">⌘N</span></button>
        <div class="sidebar__section">
          <span class="sidebar__label">今天</span>
          <button class="history-item history-item--active" type="button"><span class="history-item__icon">◇</span><span id="conversation-title">新对话</span></button>
        </div>
        <div class="sidebar__footer"><span class="status-dot"></span>本地服务<span class="platform">Personal Agent</span></div>
      </aside>
      <main class="chat">
        <header class="chat__header">
          <div><strong>Personal Work Agent</strong><span id="status-label" class="model-status">DeepSeek v4.1 · Streamable HTTP</span></div>
          <button class="header-action" type="button" title="更多选项">•••</button>
        </header>
        <section class="chat__content">
          <div id="empty-state" class="empty-state">
            <div class="agent-mark">✦</div>
            <h1>今天想处理什么？</h1>
            <p>与 DeepSeek 对话，整理想法、分析问题或推进你的工作。</p>
            <div class="suggestions">
              <button type="button" data-prompt="帮我梳理今天最重要的三项工作">梳理今日重点</button>
              <button type="button" data-prompt="帮我把一个模糊想法整理成执行计划">制定执行计划</button>
              <button type="button" data-prompt="帮我分析一个复杂问题并给出建议">分析复杂问题</button>
            </div>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
        </section>
        <footer class="composer-wrap">
          <form id="composer-form" class="composer">
            <textarea id="composer-input" rows="1" placeholder="发送消息给 Personal Work Agent" aria-label="聊天消息"></textarea>
            <div class="composer__actions">
              <button class="tool-button" type="button" title="添加上下文">＋</button>
              <span>Enter 发送 · Shift Enter 换行</span>
              <button id="send-button" class="send-button" type="submit" title="发送">↑</button>
            </div>
          </form>
        </footer>
      </main>
    </div>
    <script src="../renderer.js"></script>
  </body>
</html>
