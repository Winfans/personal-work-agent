services:
  mysql:
    image: mysql:8.4
    container_name: personal-workbench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: personal-workbench-dev
      MYSQL_DATABASE: personal_workbench
    ports:
      - "3306:3306"
    volumes:
      - personal-workbench-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppersonal-workbench-dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  personal-workbench-mysql-data:
